<mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Playlists</mat-label>
    <mat-select 
        [value]="selectedPlaylist()"
        (valueChange)="playlist.emit($event)">
        @for (playlist of playlists(); track playlist.href) {
            <mat-option [value]="playlist.href"> 
                {{ playlist.name }} 
            </mat-option>
        }
    </mat-select>
</mat-form-field>
